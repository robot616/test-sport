        var currentIndex = 0;
        var currentQualityIndex = 0;
        var isPlayerSetup = false;

        function toggleFullScreen() {
            var player = jwplayer("player");
            if (player.getFullscreen()) {
                player.setFullscreen(false);
            } else {
                player.setFullscreen(true);
            }
        }

        function toggleDrawer(open) {
            var overlay = document.getElementById('drawerOverlay');
            if (open) {
                overlay.classList.add('open');
            } else {
                overlay.classList.remove('open');
            }
        }

        function renderList(channels) {
            var list = document.getElementById('channelList');
            list.innerHTML = '';
            channels.forEach(function(ch, index) {
                var item = document.createElement('li');
                item.className = 'channel-item' + (index === currentIndex ? ' active' : '');
                
                item.onclick = function() {
                    currentIndex = channelsData.indexOf(ch);
                    selectChannel(currentIndex, 0);
                    toggleDrawer(false);
                };
                item.innerHTML = `
                    <img src="${ch.logo}" class="channel-logo" onerror="this.style.display='none'">
                    <div class="channel-info">
                        <span class="channel-name">${ch.name}</span>
                        <span class="channel-group">${ch.group}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function renderQualityBar(qualities) {
            var bar = document.getElementById('qualityBar');
            bar.innerHTML = '';
            if (!qualities || qualities.length === 0) {
                bar.style.display = 'none';
                return;
            }
            bar.style.display = 'flex';
            qualities.forEach(function(q, qIdx) {
                var btn = document.createElement('button');
                btn.className = 'quality-btn' + (qIdx === currentQualityIndex ? ' active' : '');
                btn.innerText = q.label;
                btn.onclick = function() {
                    selectChannel(currentIndex, qIdx);
                };
                bar.appendChild(btn);
            });
        }

        function selectChannel(index, qualityIdx) {
            currentIndex = index;
            var ch = channelsData[index];
            var streamUrl = "";
            var qualityText = "";

            if (ch.qualities && ch.qualities.length > 0) {
                currentQualityIndex = (typeof qualityIdx !== 'undefined') ? qualityIdx : 0;
                streamUrl = ch.qualities[currentQualityIndex].url;
                qualityText = ' (' + ch.qualities[currentQualityIndex].label + ')';
                renderQualityBar(ch.qualities);
            } else {
                streamUrl = ch.url;
                renderQualityBar([]);
            }

            document.getElementById('current-channel-title').innerText = ch.name + qualityText;
            var items = document.querySelectorAll('.channel-item');
            items.forEach(function(it) { it.classList.remove('active'); });
            if (items[index]) items[index].classList.add('active');

            playStream(streamUrl);
        }

        function handleSearch() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            var filtered = channelsData.filter(function(c) {
                return c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query);
            });
            renderList(filtered);
        }

        function playStream(url) {
            if (!isPlayerSetup) {
                const playerInstance = jwplayer("player").setup({
                    file: url,
                    type: "hls",
                    width: "100%",
                    height: "100%",
                    autostart: true,
                    stretching: "uniform"
                });

                playerInstance.on('ready', function() {
                    const listIcon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNCA2aDE2TTQgMTJoMTZNNCAxOGgxNiIvPjwvc3ZnPg==";
                    playerInstance.addButton(listIcon, "قائمة القنوات", function() { toggleDrawer(true); }, "channels-button");

                    let isStretched = false;
                    const diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";
                    playerInstance.addButton(
                        diagonalCutArrow, "توسيع/تضييق الصورة", 
                        function() {
                            if (!isStretched) {
                                playerInstance.setConfig({ stretching: "exactfit" }); isStretched = true;
                            } else {
                                playerInstance.setConfig({ stretching: "uniform" }); isStretched = false;
                            }
                        }, "stretch-button"
                    );
                });

                playerInstance.on('error', function() {
                    toggleDrawer(true);
                });

                isPlayerSetup = true;
            } else {
                jwplayer("player").load([{ file: url }]);
                jwplayer("player").play();
            }
        }

        renderList(channelsData);
        selectChannel(0, 0);
    </script>

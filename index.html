<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV - Extracted Channels</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://img.icons8.com/fluency/512/play.png">
    <meta name="apple-mobile-web-app-title" content="Sports Hub">

    <!-- مكتبة JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #0f0f0f; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .app-container { display: flex; width: 100vw; height: 100vh; flex-direction: row; }
        .sidebar {
            width: 320px; background: #181818;
            border-left: 1px solid #333; display: flex; flex-direction: column; z-index: 10;
        }
        .search-box { padding: 15px; background: #222; border-bottom: 1px solid #333; }
        .search-box input {
            width: 100%; padding: 12px; background: #111; border: 1px solid #444;
            color: #fff; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none;
        }
        .search-box input:focus { border-color: #1dcf60; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        
        .category-header {
            color: #1dcf60; font-size: 15px; font-weight: bold;
            padding: 10px; border-right: 3px solid #1dcf60;
            background: #112b1a; border-radius: 4px; margin-bottom: 5px; margin-top: 15px;
        }

        .channel-btn {
            background: #222; padding: 12px 15px; margin-bottom: 5px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: space-between;
        }
        .channel-btn:hover { background: #333; }
        .channel-btn.active { background: #1dcf60; color: #fff; }
        .player-wrapper { flex: 1; position: relative; background: #000; }
        #player { position: absolute !important; top: 0; right: 0; bottom: 0; left: 0; width: 100% !important; height: 100% !important; }
        
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .player-wrapper { height: 40vh; flex: none; }
            .sidebar { width: 100%; height: 60vh; border-left: none; border-top: 1px solid #333; }
        }

        /* أيقونة التكبير 55% */
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=');
            background-size: 55%; 
            background-position: center; background-repeat: no-repeat;
        }
        .jw-flag-fullscreen .jw-icon-fullscreen {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNOCAzdjNhMiAyIDAgMCAxLTIgMkgzbTE4IDBoLTNhMiAyIDAgMCAxLTItMlYzbTAgMThoM2EyIDIgMCAwIDEgMiAydjMiLz48L3N2Zz4=');
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper">
            <div id="player"></div>
        </div>
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة هنا..." onkeyup="filterChannels()">
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <script>
        var channels = [ 
  { name: "On Sport HD", url: "https://fastly.live.brightcove.com/6386028928112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODYwMjg5MjgxMTIifQ.7pBZHXb93BJ47HBrEiPQvSquoHi92NStYSX3JKYcznQ/chunklist.m3u8" },
  { name: "On Sport Max", url: "https://fastly.live.brightcove.com/6384149663112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODQxNDk2NjMxMTIifQ.0yJpNEV0ZSId11mURgeaOhXZvov07Uj-VI_0qt0LLSQ/chunklist.m3u8" },
  { name: "On Sport Plus", url: "https://fastly.live.brightcove.com/6384149663112/us-east-1/6416013238001/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJob3N0IjoieWN3Ymx1LmVncmVzcy5zenkzeHgiLCJhY2NvdW50X2lkIjoiNjQxNjAxMzIzODAwMSIsImVobiI6ImZhc3RseS5saXZlLmJyaWdodGNvdmUuY29tIiwiaXNzIjoiYmxpdmUtcGxheWJhY2stc291cmNlLWFwaSIsInN1YiI6InBhdGhtYXB0b2tlbiIsImF1ZCI6WyI2NDE2MDEzMjM4MDAxIl0sImp0aSI6IjYzODQxNDk2NjMxMTIifQ.0yJpNEV0ZSId11mURgeaOhXZvov07Uj-VI_0qt0LLSQ/chunklist.m3u8" },
        ];

        var playerInstance = null;

        function renderChannels(filterText) {
            if (!filterText) filterText = "";
            var listContainer = document.getElementById("channelList");
            listContainer.innerHTML = "";
            var currentCat = "";

            for (var i = 0; i < channels.length; i++) {
                var channel = channels[i];
                if (channel.name.toLowerCase().indexOf(filterText.toLowerCase()) !== -1) {
                    if (channel.cat !== currentCat && filterText === "") {
                        var catHeader = document.createElement("div");
                        catHeader.className = "category-header";
                        catHeader.innerText = channel.cat;
                        listContainer.appendChild(catHeader);
                        currentCat = channel.cat;
                    }

                    var btn = document.createElement("div");
                    btn.className = "channel-btn";
                    btn.id = "btn-" + i;
                    
                    var typeBadge = "LIVE";
                    if (channel.url.indexOf(".m3u8") !== -1 || channel.url.indexOf(".ts") !== -1) typeBadge = "HLS";
                    if (channel.url.indexOf(".mpd") !== -1) typeBadge = "DASH";

                    btn.innerHTML = '<span>' + channel.name + '</span>' +
                                    '<span style="font-size: 10px; color: #aaa; background: #333; padding: 2px 6px; border-radius: 4px;">' + typeBadge + '</span>';
                    
                    (function(index) {
                        btn.onclick = function() { playChannel(index); };
                    })(i);
                    listContainer.appendChild(btn);
                }
            }
        }

        function playChannel(index) {
            if (typeof jwplayer === 'undefined') {
                document.getElementById('player').innerHTML = '<h3 style="color:#ff4d4d; text-align:center; margin-top:20%; font-family:tahoma;">تم حظر مشغل الفيديو!<br>يرجى إيقاف مانع الإعلانات (AdBlock).</h3>';
                return;
            }

            var channel = channels[index];
            var allBtns = document.querySelectorAll(".channel-btn");
            for (var j = 0; j < allBtns.length; j++) { allBtns[j].classList.remove("active"); }
            var activeBtn = document.getElementById("btn-" + index);
            if(activeBtn) activeBtn.classList.add("active");

            var setupConfig = {
                file: channel.url,
                type: channel.url.indexOf(".m3u8") !== -1 || channel.url.indexOf(".ts") !== -1 ? "hls" : "dash",
                width: "100%", height: "100%",
                autostart: true, preload: "auto", stretching: "uniform"
            };

            // إعدادات التشفير السليمة
            if (channel.k1 && channel.k2) {
                setupConfig.drm = { clearkey: { keyId: channel.k1, key: channel.k2 } };
            }

            playerInstance = jwplayer("player").setup(setupConfig);

            playerInstance.on('ready', function() {
                var isStretched = false;
                var diagonalCutArrow = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTQgMTBsNy03bS02IDBoNnY2bS0xMSA1bC03IDdtNiAwSDN2LTYiLz48L3N2Zz4=";

                playerInstance.addButton(
                    diagonalCutArrow, 
                    "توسيع/تضييق الصورة", 
                    function() {
                        if (!isStretched) {
                            playerInstance.setConfig({ stretching: "exactfit" }); 
                            isStretched = true;
                        } else {
                            playerInstance.setConfig({ stretching: "uniform" });
                            isStretched = false;
                        }
                    },
                    "stretch-button"
                );
            });
        }

        function filterChannels() {
            var text = document.getElementById("searchInput").value;
            renderChannels(text);
        }

        renderChannels("");
        if(channels.length > 0) playChannel(0);

    </script>
</body>
</html>

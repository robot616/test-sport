    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            /* توجيه من اليسار لليمين لضمان بقاء القائمة على اليسار كما في الصورة */
            direction: ltr; 
        }

        /* ------------------------------------- */
        /* تصميم القائمة الجانبية (Sidebar) */
        /* ------------------------------------- */
        .sidebar {
            width: 320px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            z-index: 10;
        }

        .search-container {
            padding: 15px;
            background-color: #181818;
            border-bottom: 1px solid #222;
        }

        .search-box {
            width: 100%;
            background-color: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 15px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            direction: rtl; /* الكتابة بالعربي داخل صندوق البحث */
        }

        .search-box:focus {
            border-color: #1ed760;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* تخصيص شريط التمرير (Scrollbar) */
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-track { background: #121212; }
        .channel-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .channel-list::-webkit-scrollbar-thumb:hover { background: #555; }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .channel-item:hover {
            background-color: #2a2a2a;
        }

        .channel-item.active {
            background-color: #2ecc71; /* اللون الأخضر المطابق للصورة */
            color: #000;
        }

        .channel-badge {
            background-color: #333;
            color: #aaa;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .channel-item.active .channel-badge {
            background-color: rgba(0, 0, 0, 0.2);
            color: #000;
        }

        .channel-name {
            font-size: 14px;
            font-weight: bold;
            direction: rtl;
        }

        /* ------------------------------------- */
        /* منطقة المشغل */
        /* ------------------------------------- */
        .player-container {
            flex: 1;
            position: relative;
            background-color: #000;
        }

        #player {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        /* تعديلات أيقونات JW Player */
        .jw-icon-fullscreen svg { display: none !important; }
        .jw-icon-fullscreen {

        let playerInstance;

        function renderList(channels) {
            const list = document.getElementById('channelList');
            list.innerHTML = '';
            
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                // تحديد العنصر الأول ليكون المفعل افتراضياً
                item.className = 'channel-item' + (index === 0 && channels.length === channelsData.length ? ' active' : '');
                
                // هيكل العنصر يطابق الصورة: الـ Badge على اليسار والاسم على اليمين
                item.innerHTML = `
                    <span class="channel-badge">${ch.type.toUpperCase()}</span>
                    <span class="channel-name">${ch.title}</span>
                `;
                
                item.onclick = function() {
                    // إزالة التفعيل عن باقي العناصر
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    
                    // تشغيل القناة
                    const originalIndex = channelsData.indexOf(ch);
                    playerInstance.playlistItem(originalIndex);
                };
                
                list.appendChild(item);
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channelsData.filter(c => c.title.toLowerCase().includes(query));
            renderList(filtered);
        }

        // تهيئة المشغل
        playerInstance = jwplayer("player").setup({
            playlist: channelsData,
            width: "100%",
            height: "100%",
            autostart: true,
            stretching: "uniform"

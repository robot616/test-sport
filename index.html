<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV - Proxy HLS</title>
    
    <link rel="icon" type="image/png" sizes="512x512" href="https://img.icons8.com/fluency/512/play.png">
    
    <!-- مكتبة HLS.js الأساسية لتشغيل البث -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #0f0f0f; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        .app-container { display: flex; width: 100vw; height: 100vh; flex-direction: row; }
        .sidebar { width: 320px; background: #181818; border-left: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
        .search-box { padding: 15px; background: #222; border-bottom: 1px solid #333; }
        .search-box input { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; box-sizing: border-box; outline: none; }
        .search-box input:focus { border-color: #1dcf60; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        .channel-list::-webkit-scrollbar { width: 6px; }
        .channel-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .category-header { color: #1dcf60; font-size: 15px; font-weight: bold; padding: 10px; border-right: 3px solid #1dcf60; background: #112b1a; border-radius: 4px; margin-bottom: 5px; margin-top: 15px; }
        .channel-btn { background: #222; padding: 12px 15px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
        .channel-btn:hover { background: #333; }
        .channel-btn.active { background: #1dcf60; color: #fff; }
        .player-wrapper { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        
        #video-player { width: 100%; height: 100%; background: #000; outline: none; }
        
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .player-wrapper { height: 40vh; flex: none; }
            .sidebar { width: 100%; height: 60vh; border-left: none; border-top: 1px solid #333; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper">
            <!-- مشغل الفيديو الافتراضي الخاص بالمتصفح -->
            <video id="video-player" controls autoplay></video>
        </div>
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة هنا..." onkeyup="filterChannels()">
            </div>
            <div class="channel-list" id="channelList"></div>
        </div>
    </div>

    <script>
        var channels = [ 
           { name: "ALKASS 1", cat: "قنوات الكأس", url: "https://liveeu-gcp.alkassdigital.net/alkass1-p/main.m3u8" },
           { name: "ALKASS 2", cat: "قنوات الكأس", url: "https://liveeu-gcp.alkassdigital.net/alkass2-p/main.m3u8" },
           { name: "ALKASS 3", cat: "قنوات الكأس", url: "https://liveeu-gcp.alkassdigital.net/alkass3-p/main.m3u8" },
           { name: "ALKASS 4", cat: "قنوات الكأس", url: "https://liveeu-gcp.alkassdigital.net/alkass4-p/main.m3u8" }
        ];

        var hls = null;
        var video = document.getElementById('video-player');

        function renderChannels(filterText) {
            if (!filterText) filterText = "";
            var listContainer = document.getElementById("channelList");
            listContainer.innerHTML = "";
            var currentCat = "";

            for (var i = 0; i < channels.length; i++) {
                var channel = channels[i];
                if (channel.name.toLowerCase().indexOf(filterText.toLowerCase()) !== -1) {
                    if (channel.cat !== currentCat && filterText === "") {
                        var catHeader = document.createElement("div");
                        catHeader.className = "category-header";
                        catHeader.innerText = channel.cat;
                        listContainer.appendChild(catHeader);
                        currentCat = channel.cat;
                    }

                    var btn = document.createElement("div");
                    btn.className = "channel-btn";
                    btn.id = "btn-" + i;
                    
                    btn.innerHTML = '<span>' + channel.name + '</span><span style="font-size: 10px; color: #aaa; background: #333; padding: 2px 6px; border-radius: 4px;">HLS</span>';
                    
                    (function(index) {
                        btn.onclick = function() { playChannel(index); };
                    })(i);
                    listContainer.appendChild(btn);
                }
            }
        }

        function playChannel(index) {
            var channel = channels[index];
            var allBtns = document.querySelectorAll(".channel-btn");
            for (var j = 0; j < allBtns.length; j++) { allBtns[j].classList.remove("active"); }
            var activeBtn = document.getElementById("btn-" + index);
            if(activeBtn) activeBtn.classList.add("active");

            // تدمير البث القديم إن وُجد
            if (hls) { hls.destroy(); }

            if (Hls.isSupported()) {
                // الفكرة كلها هنا: إضافة البروكسي قبل كل طلب سحب للفيديو
                hls = new Hls({
                    xhrSetup: function(xhr, url) {
                        // استخدام خدمة Proxy مجانية لتخطي الـ CORS
                        var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
                        xhr.open('GET', proxyUrl, true);
                    }
                });

                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(e) { console.log("التشغيل التلقائي يحتاج لتفاعل المستخدم أولاً."); });
                });
            } 
            // دعم متصفح سفاري (أجهزة أبل) لأنها تشغل البث بدون HLS.js
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // في سفاري غالباً الـ CORS ليس مشكلة كبيرة للبث المباشر
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }
        }

        renderChannels("");
        if(channels.length > 0) playChannel(0);

    </script>
</body>
</html>
